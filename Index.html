<!DOCTYPE html>
<html>
<head>
<title>GD Level Hub</title>
</head>

<body>

<h1>Publica tu nivel de Geometry Dash</h1>

<input id="name" placeholder="Nombre del nivel">
<input id="id" placeholder="ID">
<input id="creator" placeholder="Creador">

<button onclick="postLevel()">Publicar</button>

<div id="levels"></div>

<script>
function postLevel(){

let name=document.getElementById("name").value
let id=document.getElementById("id").value
let creator=document.getElementById("creator").value

let div=document.createElement("div")

div.innerHTML="<h3>"+name+"</h3><p>ID: "+id+"</p><p>Creador: "+creator+"</p>"

document.getElementById("levels").appendChild(div)

}
</script>

</body>
</html>
